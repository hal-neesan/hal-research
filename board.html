<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掲示板 | Halねえさんの乗務手帳（リサーチ版）</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: sans-serif; margin: 0; padding: 16px; line-height: 1.6; }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { font-size: 13px; opacity: .75; margin: 0 0 16px; }
  a.back { display: inline-block; margin-bottom: 12px; }
  form { border: 1px solid #8884; border-radius: 10px; padding: 12px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; margin: 8px 0 4px; }
  input[type="text"], textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 8px; border-radius: 6px; border: 1px solid #8888; background: transparent; color: inherit; }
  textarea { min-height: 90px; }
  button { margin-top: 12px; font-size: 16px; padding: 10px 20px; border-radius: 8px; border: 0; background: #2e7d32; color: #fff; width: 100%; }
  button:disabled { opacity: .5; }
  .post { border-bottom: 1px solid #8884; padding: 10px 2px; }
  .meta { font-size: 12px; opacity: .7; }
  .name { font-weight: bold; }
  .body { white-space: pre-wrap; word-break: break-word; }
  .msg { font-size: 14px; margin: 10px 0; }
  .note { color: #b71c1c; font-size: 14px; margin: 10px 0 0; }
  @media (prefers-color-scheme: dark) { .note { color: #ff9e99; } }
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">← アプリに戻る</a>
  <h1>掲示板</h1>
  <p class="sub">試用版の感想・質問はこちらへどうぞ。名前は空でも書けます（「名無し」になります）。<a href="survey.html">試用アンケート（1分）はこちら</a>。</p>

  <form id="post-form">
    <label for="name">名前（任意）</label>
    <input type="text" id="name" maxlength="50" autocomplete="off">
    <label for="body">本文</label>
    <textarea id="body" maxlength="1000" required></textarea>
    <p class="note">この掲示板は公開されます。会社名、個人名、お客様の情報は書かないでください。</p>
    <button type="submit" id="submit">書き込む</button>
    <p class="msg" id="form-msg"></p>
  </form>

  <div id="list"><p class="msg">読み込み中…</p></div>
</main>
<script>
  var SB_URL = 'https://fffjfvoxjddsqnofclop.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmZmpmdm94amRkc3Fub2ZjbG9wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4ODA4MzQsImV4cCI6MjExMDQ1NjgzNH0.BEJNPdJNXBPoeyz-UU20MQ1OYDI1dq2mE7qh_guhgLg';
  var SEEN_KEY = 'halBoardLastSeen';

  function fmt(iso) {
    var d = new Date(iso);
    return d.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function headers() {
    return { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
  }

  function load() {
    fetch(SB_URL + '/rest/v1/posts?select=id,name,body,created_at&order=created_at.desc&limit=100', { headers: headers() })
      .then(function (r) { if (!r.ok) throw new Error('load failed'); return r.json(); })
      .then(function (rows) {
        if (!Array.isArray(rows)) throw new Error('load failed');
        var list = document.getElementById('list');
        list.textContent = '';
        if (!rows.length) {
          var empty = document.createElement('p');
          empty.className = 'msg';
          empty.textContent = 'まだ書き込みはありません。最初の感想をお願いします。';
          list.appendChild(empty);
        } else {
          rows.forEach(function (p) {
            var post = document.createElement('div');
            post.className = 'post';
            var meta = document.createElement('div');
            meta.className = 'meta';
            var nm = document.createElement('span');
            nm.className = 'name';
            nm.textContent = p.name || '名無し';
            meta.appendChild(nm);
            meta.appendChild(document.createTextNode(' ・ ' + fmt(p.created_at)));
            var bd = document.createElement('div');
            bd.className = 'body';
            bd.textContent = p.body;
            post.appendChild(meta);
            post.appendChild(bd);
            list.appendChild(post);
          });
          try { localStorage.setItem(SEEN_KEY, rows[0].created_at); } catch (e) {}
        }
      })
      .catch(function () {
        var list = document.getElementById('list');
        list.textContent = '';
        var p = document.createElement('p');
        p.className = 'msg';
        p.textContent = '読み込めませんでした。電波の良いところで開き直してください。';
        list.appendChild(p);
      });
  }

  document.getElementById('post-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = document.getElementById('submit');
    var msg = document.getElementById('form-msg');
    var name = document.getElementById('name').value.trim();
    var body = document.getElementById('body').value.trim();
    if (!body) { msg.textContent = '本文を入れてください。'; return; }
    var lastPost = 0;
    try { lastPost = Number(localStorage.getItem('halBoardLastPost') || 0); } catch (e) {}
    if (Date.now() - lastPost < 10000) { msg.textContent = '少し間をあけてから書き込んでください。'; return; }
    btn.disabled = true; msg.textContent = '送信中…';
    fetch(SB_URL + '/rest/v1/posts', {
      method: 'POST',
      headers: Object.assign(headers(), { 'Prefer': 'return=minimal' }),
      body: JSON.stringify({ name: name || '名無し', body: body })
    }).then(function (r) {
      btn.disabled = false;
      if (r.ok) {
        try { localStorage.setItem('halBoardLastPost', String(Date.now())); } catch (e) {}
        document.getElementById('body').value = '';
        msg.textContent = '書き込みました。ありがとうございます。';
        load();
      } else {
        msg.textContent = '送れませんでした。もう一度お試しください。';
      }
    }).catch(function () {
      btn.disabled = false;
      msg.textContent = '送れませんでした。電波の良いところでお試しください。';
    });
  });

  load();
</script>
</body>
</html>
